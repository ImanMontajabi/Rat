[workspace]
members = ["crates/rat-core", "crates/rat-platform", "crates/rat-desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0


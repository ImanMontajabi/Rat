name: Rat
options:
  bundleIdPrefix: com.imanmontajabi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  RatFilter:
    path: RatFilter
targets:
  Rat:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Vendor"]
      - path: App/Vendor
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Fetch GeoIP database
        script: '"$SRCROOT/scripts/fetch-geoip.sh"'
        basedOnDependencyAnalysis: false
    dependencies:
      - package: RatFilter
        product: RatMonitor
      - package: RatFilter
        product: RatGeo
      - package: RatFilter
        product: RatFilterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imanmontajabi.Rat
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rat
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
  RatTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AppTests]
    dependencies:
      - target: Rat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.imanmontajabi.RatTests
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Rat.app/Contents/MacOS/Rat
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Rat:
    build:
      targets:
        Rat: all
    test:
      targets: [RatTests]

name: Rat
options:
  bundleIdPrefix: com.imanmontajabi
# UITest: a Debug build under its own bundle identifier, so the UI tests never quit (or share preferences with)
# the Rat the user is running.
configs:
  Debug: debug
  Release: release
  UITest: debug
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  RatFilter:
    path: RatFilter
targets:
  Rat:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Vendor"]
      - path: App/Vendor
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Fetch GeoIP database
        script: '"$SRCROOT/scripts/fetch-geoip.sh"'
        basedOnDependencyAnalysis: false
    dependencies:
      - package: RatFilter
        product: RatMonitor
      - package: RatFilter
        product: RatGeo
      - package: RatFilter
        product: RatFilterCore
      - package: RatFilter
        product: RatEnforce
      - target: rat-enforcerd
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imanmontajabi.Rat
        MARKETING_VERSION: 1.3.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rat
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
      configs:
        UITest:
          PRODUCT_BUNDLE_IDENTIFIER: com.imanmontajabi.Rat.uitest
  rat-enforcerd:
    type: tool
    platform: macOS
    sources: [Enforcerd]
    dependencies:
      - package: RatFilter
        product: RatEnforce
    settings:
      base:
        PRODUCT_NAME: rat-enforcerd
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
  RatTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AppTests]
    dependencies:
      - target: Rat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.imanmontajabi.RatTests
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Rat.app/Contents/MacOS/Rat
        BUNDLE_LOADER: $(TEST_HOST)
  RatUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: Rat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.imanmontajabi.RatUITests
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: Rat
schemes:
  Rat:
    build:
      targets:
        Rat: all
    test:
      targets: [RatTests]
  # Needs a logged-in GUI session: run with scripts/test-ui.sh, not in CI.
  RatUITests:
    build:
      targets:
        Rat: all
        RatUITests: [test]
    test:
      config: UITest
      targets: [RatUITests]
